# Example configuration for video pipeline
# Copy this to config/default/config.yaml and customize

niche: music
channel_id: default
prompt: ""
prompt_file: config/default/prompt.txt
output_dir: output/default

# MusicGen settings
musicgen:
  model: musicgen-small  # Options: musicgen-small, musicgen-medium, musicgen-large
  duration: 3600  # 60 minutes in seconds
  temperature: 0.7
  top_k: 250
  top_p: 0.8

# Stable Diffusion settings
stable_diffusion:
  model: runwayml/stable-diffusion-v1-5
  width: 1280
  height: 720
  num_inference_steps: 50
  guidance_scale: 7.5

# FFmpeg settings
ffmpeg:
  video_bitrate: 2500k
  audio_bitrate: 192k
  frame_rate: 30

# YouTube settings
youtube:
  privacy_status: private  # Options: private, unlisted, public
  category_id: 22  # People & Blogs

# LLM settings
llm:
  api_key: ""  # Your OpenRouter/Anthropic API key
  model: anthropic/claude-3.5-sonnet
